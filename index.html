
<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="description" content="Digo & Jackie: entretenimento, cinema, curiosidades, ciência, mistérios e muito mais. Explore nosso universo!">

    <meta name="author" content="Digo & Jackie">
    <meta name="robots" content="index, follow">

    <!-- URL CANÔNICA -->

    <!-- =====================================================

    <link rel="icon" type="image/png"
          href="https://portaldigoejackie.github.io/logo-digoejackie.png">

    <link rel="apple-touch-icon"
          href="https://portaldigoejackie.github.io/logo-digoejackie.png">

    <!-- =====================================================

    <meta property="og:type" content="website">

    <meta property="og:image:alt" content="Logo oficial Digo & Jackie">

    <!-- =====================================================
         4. TWITTER CARD
    ====================================================== -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Digo & Jackie | Entretenimento e Curiosidades">
    <meta name="twitter:description" content="Um universo de entretenimento e curiosidades!">
    <meta name="twitter:image" content="https://portaldigoejackie.github.io/logo-digoejackie.png">

    <!-- =====================================================
         5. SCHEMA.ORG - DADOS ESTRUTURADOS
    ====================================================== -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Digo & Jackie",
        "alternateName": "Portal Digo & Jackie",
        "url": "https://portaldigoejackie.github.io/",
        "inLanguage": "pt-BR",
        "description": "Portal de entretenimento, cinema e curiosidades."
    }
    </script>

    <!-- =====================================================
         6. BOOTSTRAP 5.3.8
    ====================================================== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- =====================================================
         7. BOOTSTRAP ICONS
    ====================================================== -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- =====================================================
         8. CSS PERSONALIZADO
    ====================================================== -->
    <style>

        /* -----------------------------------------------
           VARIÁVEIS GLOBAIS
        ------------------------------------------------ */
        :root {
            --color-header: #0f0f0f;
            --color-footer: #202020;
            --color-background: #ffffff;
            --color-surface: #f8f8f8;
            --color-text: #212121;
            --color-muted: #606060;
            --color-accent: #e62117;

            --header-height: 68px;
            --content-width: 1440px;
        }

        /* -----------------------------------------------
           CONFIGURAÇÕES GERAIS
        ------------------------------------------------ */
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--color-background);
            color: var(--color-text);
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
        }

        /* -----------------------------------------------
           CABEÇALHO PRINCIPAL
        ------------------------------------------------ */
        .main-header {
            width: 100%;
            min-height: var(--header-height);
            background: var(--color-header);
            color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 1030;
            box-shadow: 0 2px 8px rgba(0,0,0,.18);
        }

        .header-container {
            max-width: var(--content-width);
            min-height: var(--header-height);
            margin: auto;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* LOGO */
        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            min-width: 0;
        }

        .brand-logo {
            width: 46px;
            height: 46px;
            object-fit: contain;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -.5px;
            margin: 0;
            white-space: nowrap;
        }

        .brand-name span {
            color: #ff453a;
        }

        /* NAVEGAÇÃO */
        .main-navigation {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-navigation .nav-link {
            color: #eeeeee;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 8px;
            transition: background .2s ease;
        }

        .main-navigation .nav-link:hover,
        .main-navigation .nav-link.active {
            background: #303030;
            color: #ffffff;
        }

        /* BOTÃO MOBILE */
        .mobile-menu-button {
            color: #ffffff;
            border: 1px solid #444444;
            background: transparent;
            border-radius: 8px;
            padding: 7px 11px;
            font-size: 23px;
        }

        .mobile-menu-button:hover {
            background: #303030;
        }

        /* MENU MOBILE */
        .mobile-navigation {
            background: #171717;
            border-top: 1px solid #303030;
            padding: 8px 20px 14px;
        }

        .mobile-navigation .nav-link {
            color: #eeeeee;
            padding: 12px 8px;
            border-bottom: 1px solid #303030;
            font-size: 14px;
        }

        /* -----------------------------------------------
           CONTEÚDO PRINCIPAL
           Intencionalmente vazio nesta etapa.
        ------------------------------------------------ */
        main {
            width: 100%;
            max-width: var(--content-width);
            margin: 0 auto;
            padding: 24px;
            flex: 1;
            min-height: 400px;
        }

        /* -----------------------------------------------
           RODAPÉ
        ------------------------------------------------ */
        .main-footer {
            width: 100%;
            background: var(--color-footer);
            color: #eeeeee;
            margin-top: auto;
        }

        .footer-container {
            max-width: var(--content-width);
            margin: auto;
            padding: 28px 24px;
        }

        .footer-bottom {
            border-top: 1px solid #3b3b3b;
            padding-top: 18px;
            margin-top: 18px;
            color: #aaaaaa;
            font-size: 13px;
            text-align: center;
        }

        /* -----------------------------------------------
           RESPONSIVIDADE
        ------------------------------------------------ */
        @media (max-width: 768px) {

            :root {
                --header-height: 60px;
            }

            .header-container {
                padding: 7px 15px;
            }

            .brand-logo {
                width: 40px;
                height: 40px;
            }

            .brand-name {
                font-size: 17px;
            }

            main {
                padding: 16px;
            }

            .footer-container {
                padding: 24px 18px;
            }
        }

        @media (max-width: 360px) {
            .brand-logo {
                width: 35px;
                height: 35px;
            }

            .brand-name {
                font-size: 15px;
            }
        }

    </style>
</head>

<body>

    <!-- =====================================================
         9. CABEÇALHO E NAVEGAÇÃO
    ====================================================== -->
    <header class="main-header">

        <div class="header-container">

            <!-- LOGO E NOME -->
            <a href="/" class="brand-area" aria-label="Digo & Jackie - Página inicial">

                <img
                    src="https://portaldigoejackie.github.io/logo-digoejackie.png"
                    class="brand-logo"
                    alt="Logo Digo & Jackie"
                    width="46"
                    height="46">

                <h1 class="brand-name">
                    Digo <span>&</span> Jackie
                </h1>

            </a>

            <!-- MENU DESKTOP -->
            <nav class="main-navigation d-none d-md-flex"
                 aria-label="Navegação principal">

                <a href="/" class="nav-link active">
                    <i class="bi bi-house-door me-1"></i>
                    Início
                </a>

            </nav>

            <!-- BOTÃO MENU MOBILE -->
            <button
                class="mobile-menu-button d-md-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mobileMenu"
                aria-controls="mobileMenu"
                aria-expanded="false"
                aria-label="Abrir menu de navegação">

                <i class="bi bi-list"></i>

            </button>

        </div>

        <!-- NAVEGAÇÃO MOBILE -->
        <div class="collapse mobile-navigation d-md-none" id="mobileMenu">

            <nav aria-label="Navegação mobile">

                <a href="/" class="nav-link">
                    <i class="bi bi-house-door me-2"></i>
                    Início
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         10. CONTEÚDO PRINCIPAL
         Reservado para os próximos módulos do portal.
    ====================================================== -->
    <main id="conteudo-principal" role="main">

    </main>


    <!-- =====================================================
         11. RODAPÉ
    ====================================================== -->
    <footer class="main-footer">

        <div class="footer-container">

            <!-- FUTUROS ELEMENTOS DO RODAPÉ -->

            <div class="footer-bottom">

                &copy; <span id="currentYear"></span> Digo & Jackie.
                Todos os direitos reservados.

            </div>

        </div>

    </footer>


    <!-- =====================================================
         12. JAVASCRIPT E BOOTSTRAP
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

    <script>

        /* -----------------------------------------------
           ATUALIZAÇÃO AUTOMÁTICA DO ANO NO RODAPÉ
        ------------------------------------------------ */
        document.getElementById("currentYear").textContent =
            new Date().getFullYear();

    </script>

</body>
</html>
